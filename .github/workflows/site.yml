name: Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every morning, so a new brand release reaches the site within a day.
    - cron: "17 9 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Find Brand Release
        id: brand-release
        # The site uses the newest brand release, so brand changes only go live when they're released.
        run: |
          TAG=$(gh release view --repo LeanMeanCleanApps/brand --json tagName --jq .tagName)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Brand release: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Checkout Brand
        id: brand
        uses: actions/checkout@v7
        with:
          repository: LeanMeanCleanApps/brand
          ref: ${{ steps.brand-release.outputs.tag }}
          path: .brand
          persist-credentials: false

      - name: Setup Node
        id: setup
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        id: install
        run: npm ci

      - name: Build
        id: build
        run: npm run build
        env:
          # Public by design: these end up in every page. Leave a variable unset to build without that counter.
          PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_ANALYTICS_TOKEN }}
          PUBLIC_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}

      - name: Upload Site
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy Site
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
