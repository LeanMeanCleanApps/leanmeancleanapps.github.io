name: Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every morning, so a new brand release reaches the site within a day.
    - cron: "17 9 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          # Full history, so each page's "Last updated" and sitemap lastmod come from its own last commit.
          fetch-depth: 0

      - name: Find Brand Release
        id: brand-release
        # The site uses the newest brand release, so brand changes only go live when they're released.
        run: |
          TAG=$(gh release view --repo LeanMeanCleanApps/brand --json tagName --jq .tagName)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Brand release: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Checkout Brand
        id: brand
        uses: actions/checkout@v7
        with:
          repository: LeanMeanCleanApps/brand
          ref: ${{ steps.brand-release.outputs.tag }}
          path: .brand
          persist-credentials: false

      - name: Setup Node
        id: setup
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        id: install
        run: npm ci

      - name: Build
        id: build
        run: npm run build
        env:
          # Public by design: these end up in every page, so a repository variable is enough, but a secret works too.
          # Leave it unset to build without the counter.
          PUBLIC_POSTHOG_KEY: ${{ vars.POSTHOG_KEY || secrets.POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ vars.POSTHOG_HOST || secrets.POSTHOG_HOST }}
          PUBLIC_POSTHOG_UI_HOST: ${{ vars.POSTHOG_UI_HOST || secrets.POSTHOG_UI_HOST }}

      - name: Check Analytics
        id: analytics
        # Fails a deploy of our own site when the counter isn't set up, or didn't make it into the pages. Pull requests
        # and forks only get a warning, so they still build without the variables.
        run: |
          level=warning
          if [ "$DEPLOYING" = "true" ]; then level=error; fi
          failed=0
          problem() { echo "::$level::$1"; echo "- $1" >> "$GITHUB_STEP_SUMMARY"; failed=1; }

          [[ "$POSTHOG_KEY" =~ ^phc_[A-Za-z0-9]+$ ]] || problem "POSTHOG_KEY is missing or isn't a PostHog project key (phc_...)."
          [ -z "$POSTHOG_HOST" ] || [[ "$POSTHOG_HOST" =~ ^https://[a-z0-9.-]+$ ]] || problem "POSTHOG_HOST must be an https:// address with no trailing slash, such as https://eu.i.posthog.com."

          pages=$(find dist -name '*.html' | wc -l)
          if [ -n "$POSTHOG_KEY" ]; then
            missing=$(grep -L "posthog.init" -r dist --include='*.html' | wc -l)
            [ "$missing" -eq 0 ] || problem "$missing of $pages pages have no PostHog snippet."
          fi

          if [ "$failed" -eq 0 ]; then echo "Analytics: PostHog is on all $pages pages." >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$failed" -eq 1 ] && [ "$level" = "error" ]; then exit 1; fi
        env:
          DEPLOYING: ${{ github.repository == 'LeanMeanCleanApps/leanmeancleanapps.github.io' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          POSTHOG_KEY: ${{ vars.POSTHOG_KEY || secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST || secrets.POSTHOG_HOST }}

      - name: Upload Site
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy Site
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5

  index:
    name: Tell Search Engines
    runs-on: ubuntu-latest
    needs: deploy
    # Our own site only: a fork pinging Bing about leanmeanclean.dev would be a bit rude.
    if: ${{ github.repository == 'LeanMeanCleanApps/leanmeancleanapps.github.io' }}
    permissions: {}

    steps:
      - name: Submit Changed Pages
        id: indexnow
        # IndexNow tells Bing (and through it DuckDuckGo, Copilot and friends) which pages changed. The key isn't a
        # secret: it's published at the site root as public/171d5277cbc2db8c8c846ceb8e6bfe4d.txt to prove the site is ours.
        # A manual run submits every page; anything else only the pages whose lastmod moved in the last day.
        uses: bojieyang/indexnow-action@v2
        with:
          sitemap-location: https://leanmeanclean.dev/sitemap-index.xml
          key: 171d5277cbc2db8c8c846ceb8e6bfe4d
          since: ${{ github.event_name == 'workflow_dispatch' && 36500 || 1 }}
          since-unit: day
          limit: 1000
