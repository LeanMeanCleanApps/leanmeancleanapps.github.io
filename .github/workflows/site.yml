name: Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every morning, so a new brand release reaches the site within a day.
    - cron: "17 9 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Find Brand Release
        id: brand-release
        # The site uses the newest brand release, so brand changes only go live when they're released.
        run: |
          TAG=$(gh release view --repo LeanMeanCleanApps/brand --json tagName --jq .tagName)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Brand release: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Checkout Brand
        id: brand
        uses: actions/checkout@v7
        with:
          repository: LeanMeanCleanApps/brand
          ref: ${{ steps.brand-release.outputs.tag }}
          path: .brand
          persist-credentials: false

      - name: Setup Node
        id: setup
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        id: install
        run: npm ci

      - name: Build
        id: build
        run: npm run build
        env:
          # Public by design: these end up in every page, so a repository variable is enough, but a secret works too.
          # Leave one unset to build without that counter.
          PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_ANALYTICS_TOKEN || secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          PUBLIC_POSTHOG_KEY: ${{ vars.POSTHOG_KEY || secrets.POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ vars.POSTHOG_HOST || secrets.POSTHOG_HOST }}

      - name: Check Analytics
        id: analytics
        # Fails a deploy of our own site when a counter isn't set up, or didn't make it into the pages. Pull requests
        # and forks only get a warning, so they still build without the variables.
        run: |
          level=warning
          if [ "$DEPLOYING" = "true" ]; then level=error; fi
          failed=0
          problem() { echo "::$level::$1"; echo "- $1" >> "$GITHUB_STEP_SUMMARY"; failed=1; }

          [[ "$CLOUDFLARE_TOKEN" =~ ^[A-Za-z0-9]+$ ]] || problem "CLOUDFLARE_ANALYTICS_TOKEN is missing or isn't a Cloudflare Web Analytics token."
          [[ "$POSTHOG_KEY" =~ ^phc_[A-Za-z0-9]+$ ]] || problem "POSTHOG_KEY is missing or isn't a PostHog project key (phc_...)."
          [ -z "$POSTHOG_HOST" ] || [[ "$POSTHOG_HOST" =~ ^https://[a-z0-9.-]+$ ]] || problem "POSTHOG_HOST must be an https:// address with no trailing slash, such as https://eu.i.posthog.com."

          pages=$(find dist -name '*.html' | wc -l)
          if [ -n "$CLOUDFLARE_TOKEN" ]; then
            missing=$(grep -L "static.cloudflareinsights.com/beacon.min.js" -r dist --include='*.html' | wc -l)
            [ "$missing" -eq 0 ] || problem "$missing of $pages pages have no Cloudflare beacon."
          fi
          if [ -n "$POSTHOG_KEY" ]; then
            missing=$(grep -L "posthog.init" -r dist --include='*.html' | wc -l)
            [ "$missing" -eq 0 ] || problem "$missing of $pages pages have no PostHog snippet."
          fi

          if [ "$failed" -eq 0 ]; then echo "Analytics: Cloudflare and PostHog are on all $pages pages." >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$failed" -eq 1 ] && [ "$level" = "error" ]; then exit 1; fi
        env:
          DEPLOYING: ${{ github.repository == 'LeanMeanCleanApps/leanmeancleanapps.github.io' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          CLOUDFLARE_TOKEN: ${{ vars.CLOUDFLARE_ANALYTICS_TOKEN || secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          POSTHOG_KEY: ${{ vars.POSTHOG_KEY || secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST || secrets.POSTHOG_HOST }}

      - name: Upload Site
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy Site
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
